<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Ons Thuis · Verbouwplanner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1>🏠 Project Ons Thuis <span id="sync-status" class="sync-badge" hidden></span></h1>
      <div class="header-actions">
        <button id="btn-export" class="btn btn-ghost" title="Maak een reservekopie van alle gegevens">⬇ Export</button>
        <button id="btn-import" class="btn btn-ghost" title="Zet een reservekopie terug">⬆ Import</button>
        <button id="btn-reset" class="btn btn-ghost btn-danger" title="Terug naar de standaardplanning">↺ Reset</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="planning">Planning</button>
      <button class="tab" data-tab="mijlpalen">Mijlpalen</button>
      <button class="tab" data-tab="beslissingen">Beslissingen</button>
      <button class="tab" data-tab="materialen">Materialen</button>
      <button class="tab" data-tab="budget">Budget</button>
      <button class="tab" data-tab="nietvergeten">Niet vergeten</button>
    </nav>
  </header>

  <main id="content"></main>

  <!-- Popup voor het kiezen van afhankelijkheden -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="modal-title">Afhankelijk van</h3>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Annuleren</button>
        <button id="modal-save" class="btn btn-primary">Opslaan</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
